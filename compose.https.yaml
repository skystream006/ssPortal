services:
  gateway:
    environment:
      PORTAL_ADDRESS: "https://${PASSKEY_RP_ID:?Set PASSKEY_RP_ID to your public hostname}"
      PUBLIC_ORIGIN: "https://${PASSKEY_RP_ID:?Set PASSKEY_RP_ID to your public hostname}"
      HTTPS_MODE: public
    ports: !override
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:443:443/udp"

  portal:
    environment:
      PASSKEY_ORIGIN: "https://${PASSKEY_RP_ID:?Set PASSKEY_RP_ID to your public hostname}"