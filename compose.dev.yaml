services:
  gateway:
    environment:
      PORTAL_UPSTREAM: portal:5173

  portal:
    build:
      target: build
    command: ["npm", "run", "dev"]
    user: node
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      DEV_HOST: 0.0.0.0
      WATCH_POLLING: "true"
    read_only: false
    volumes:
      - ./portal:/app
      - portal_node_modules:/app/node_modules

volumes:
  portal_node_modules: