<VirtualHost *:80>
    DocumentRoot /var/www/empty
    ServerName localhost
    Alias /webtrees/ /var/www/webtrees/
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/empty>
        Require all denied
    </Directory>

    <Directory /var/www/webtrees>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        RewriteEngine On
        RewriteBase /webtrees/
        RewriteRule (^|/)\. - [F,END]
        RewriteRule ^(data|vendor|app|resources|tests|modules_v4)(/|$) - [F,END,NC]
        RewriteRule ^public/.*\.php(/|$) - [F,END,NC]
        RewriteRule ^(public/|index\.php$) - [END]
        RewriteRule ^ index.php [QSA,END]
    </Directory>

    php_admin_value session.cookie_path /webtrees/
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>